<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍓 Strawberry in Chocolate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=7aafdf73-bf1e-4ec7-8d18-07b14be93c80&lang=ru_RU" type="text/javascript"></script>
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5A4BD1;
            --primary-light: #A29BFE;
            --accent: #FD79A8;
            --bg-start: #0F0E17;
            --bg-end: #1A1A2E;
            --card-bg: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.08);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            font-family: var(--font-family);
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            padding: 0 0 40px 0;
            -webkit-font-smoothing: antialiased;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .menu-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 12px 0 16px;
        }
        .header .logo-icon {
            font-size: 48px;
            display: block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 20px rgba(108,92,231,0.3));
        }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            color: var(--primary-light);
            font-size: 10px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .map-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-bottom: 12px;
        }
        .map-card .map-container {
            width: 100%;
            height: 380px;
            position: relative;
            background: #0A0A1A;
        }
        .map-card .map-container #treasureMap {
            width: 100%;
            height: 100%;
        }
        .map-card .map-actions {
            display: flex;
            gap: 6px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }
        .map-btn {
            flex: 1;
            min-width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            font-family: var(--font-family);
            transition: var(--transition);
        }
        .map-btn:active { transform: scale(0.97); }
        .map-btn.location-btn {
            background: rgba(108,92,231,0.15);
            border-color: rgba(108,92,231,0.25);
            color: var(--primary-light);
        }

        .distance-info {
            display: none;
            padding: 10px 14px;
            background: rgba(108,92,231,0.08);
            border-top: 1px solid rgba(108,92,231,0.15);
            font-size: 12px;
            color: var(--text-secondary);
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .distance-info.show { display: flex; }
        .distance-info .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .distance-info .stat i { color: var(--primary-light); font-size: 14px; }
        .distance-info .stat .value { color: #4ADE80; font-weight: 700; font-size: 16px; }
        .distance-info .stat .label { color: var(--text-muted); font-size: 11px; }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .menu-item {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: var(--transition);
        }
        .menu-item:active { transform: scale(0.98); }
        .menu-item .item-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: rgba(255,255,255,0.03);
        }
        .menu-item .item-content {
            padding: 10px 12px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .menu-item .item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .menu-item .item-desc {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
            flex: 1;
        }
        .menu-item .item-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 16px;
        }
        .menu-item .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            color: var(--accent);
            font-size: 9px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            z-index: 5;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i {
            font-size: 18px;
            color: var(--primary-light);
        }
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            color: var(--text-muted);
            font-size: 11px;
        }
        .footer .footer-phone {
            display: inline-block;
            margin-top: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-light);
            text-decoration: none;
        }

        @media (max-width: 340px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(14px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
            animation: fadeIn 0.4s ease;
        }
        .modal-overlay.open { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: linear-gradient(160deg, #1A1A2E 0%, #0F0E17 100%);
            border-radius: var(--radius);
            max-width: 320px;
            width: 100%;
            padding: 18px 14px 16px;
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-align: center;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal .modal-image {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 4px;
            display: block;
            border: 2px solid rgba(255,215,0,0.15);
        }
        .modal .fallback-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 2px;
        }
        .modal h2 {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }
        .modal h2 span {
            background: linear-gradient(135deg, #FFD700, #FF6B00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .modal p {
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 2px;
        }
        .modal p strong {
            color: #FFD700;
        }
        .modal .btn {
            width:100%;
            padding:10px;
            border-radius:var(--radius-sm);
            border:none;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            font-family:var(--font-family);
            transition:0.2s;
            margin-top:6px;
        }
        .modal .btn:active { transform:scale(0.97); }
        .modal .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }

        .float-qr-btn {
            position: fixed;
            bottom: 20px;
            right: 16px;
            z-index: 1500;
            background: linear-gradient(135deg, #FFD700, #FF6B00);
            color: #1A1A2E;
            border: none;
            border-radius: 60px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,215,0,0.3);
            font-family: var(--font-family);
            transition: var(--transition);
            display: none;
            align-items: center;
            gap: 8px;
        }
        .float-qr-btn:active { transform: scale(0.95); }
        .float-qr-btn i { font-size: 18px; }

        .notification {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            color: #fff;
            padding: 10px 20px;
            border-radius: 100px;
            z-index: 9999;
            max-width: 90%;
            text-align: center;
            font-weight: 500;
            font-size: 13px;
            animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: var(--font-family);
            border: 1px solid var(--glass-border);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

<div class="menu-container">

    <header class="header">
        <span class="logo-icon">🍓</span>
        <div class="header-badge"><i class="fas fa-gift"></i> Подарок для вас!</div>
        <h1>Strawberry in Chocolate</h1>
        <p class="subtitle">Найди киоск и получи подарок 🍓</p>
    </header>

    <!-- MAP -->
    <div class="map-card">
        <div class="map-container">
            <div id="treasureMap"></div>
        </div>
        <div class="map-actions">
            <button class="map-btn location-btn" onclick="centerOnUser()">
                <i class="fas fa-location-dot"></i> Где я?
            </button>
        </div>
        <div class="distance-info" id="distanceInfo">
            <span class="stat">
                <i class="fas fa-shoe-prints"></i>
                <span class="value" id="stepsCount">0</span>
                <span class="label">шагов до киоска 🍓</span>
            </span>
            <span class="stat">
                <i class="fas fa-flag-checkered"></i>
                <span class="value" id="distanceKm">0</span>
                <span class="label">км</span>
            </span>
        </div>
    </div>

    <!-- MENU -->
    <div class="menu-section active">
        <div class="section-title"><i class="fas fa-strawberry"></i> Клубника в шоколаде</div>
        <div class="menu-grid" id="strawberryGrid"></div>
    </div>

    <div class="footer">
        <i class="fas fa-heart" style="color: var(--accent);"></i> С любовью, Strawberry in Chocolate
        <br><a href="tel:+79628557263" class="footer-phone"><i class="fas fa-phone"></i> +7 962 855-72-63</a>
    </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="giftModal">
    <div class="modal">
        <img src="images/gift-free.jpg" alt="Подарок" class="modal-image" 
             onerror="this.style.display='none';this.parentElement.querySelector('.fallback-icon').style.display='block'">
        <span class="fallback-icon" style="display:none;">🍓</span>
        <h2><span>Подарок!</span> 🎁</h2>
        <p>
            Для <strong>первых посетителей</strong> —<br>
            <strong>мини-порция</strong> клубники в шоколаде 🍫
        </p>
        <p style="font-size:11px;color:var(--text-muted);">Покажи QR-код кассиру</p>
        <button class="btn btn-primary" onclick="closeGiftModal()">
            Спасибо, понятно! 🙌
        </button>
    </div>
</div>

<!-- FLOATING QR BUTTON -->
<button class="float-qr-btn" id="floatQrBtn" onclick="openQrModal()">
    <i class="fas fa-qrcode"></i> Мой QR-код
</button>

<script>
    // ================================================================
    // ===== КОНСТАНТЫ =====
    // ================================================================
    const MY_LOCATION = { lat: 44.358182, lng: 38.528738 };

    let userLocation = null;
    let mapInstance = null;
    let userPlacemark = null;
    let kioskPlacemark = null;
    let watchId = null;
    let giftId = null;
    let mapReady = false;
    let gpsLocked = false;
    let ymapsReady = false;
    let giftCheckInterval = null;

    // ================================================================
    // ===== DOM REFS =====
    // ================================================================
    const $ = id => document.getElementById(id);

    // ================================================================
    // ===== MENU =====
    // ================================================================
    const MENU_ITEMS = [
        { id: '1', name: 'Классика', desc: 'Клубника в молочном шоколаде', price: 450, image: 'images/klassika.jpg', badge: '🔥 Хит' },
        { id: '2', name: 'Клубника в сливках', desc: 'Нежная клубника в бельгийских сливках', price: 450, image: 'images/klubnika-v-slivkah.jpg', badge: '⭐' },
        { id: '9', name: 'Клубника в сливках и шоколаде', desc: 'Нежная клубника в сливках и шоколаде', price: 450, image: 'images/klubnika-v-slivkah-shokolad.jpg', badge: '🔥 Хит' },
        { id: '4', name: 'Микс клубника-банан', desc: 'Клубника и банан в шоколаде', price: 450, image: 'images/miks.jpg' },
        { id: '5', name: 'Банан в шоколаде', desc: 'Спелый банан в молочном шоколаде', price: 450, image: 'images/banan.jpg' },
        { id: '16', name: 'Клубника в стакане', desc: 'Свежая клубника без шоколада', price: 350, image: 'images/klubnika-bez-shokolada.jpg' }
    ];

    function renderMenu() {
        const grid = $('strawberryGrid');
        grid.innerHTML = MENU_ITEMS.map(item => `
            <div class="menu-item">
                ${item.badge ? `<span class="badge">${item.badge}</span>` : ''}
                <img src="${item.image}" class="item-image" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%232d2d44%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2248%22%3E🍓%3C/text%3E%3C/svg%3E'">
                <div class="item-content">
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.desc}</div>
                    <div class="item-price">${item.price} ₽</div>
                </div>
            </div>
        `).join('');
    }

    // ================================================================
    // ===== QR-КОД =====
    // ================================================================
    function generateGiftQR(id) {
        const img = document.createElement('img');
        if (!id) { return ''; }
        const qrData = `gift-${id}`;
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}&color=6C5CE7&bgcolor=FFFFFF`;
        img.style.width = '100%';
        img.style.height = 'auto';
        return img.outerHTML;
    }

    function openQrModal() {
        if (!giftId) {
            showNotification('❌ Подарок ещё не активирован');
            return;
        }
        const qrHtml = generateGiftQR(giftId);
        const modal = document.createElement('div');
        modal.className = 'modal-overlay open';
        modal.id = 'qrModal';
        modal.innerHTML = `
            <div class="modal" style="max-width:300px;padding:16px;">
                <h2 style="font-size:16px;color:#fff;margin-bottom:4px;">🎫 Ваш QR-код</h2>
                <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">Покажите кассиру</p>
                <div style="background:#fff;border-radius:8px;padding:12px;max-width:160px;margin:0 auto;">
                    ${qrHtml}
                </div>
                <button class="btn btn-primary" onclick="closeQrModal()" style="margin-top:10px;padding:8px;">
                    Закрыть
                </button>
            </div>
        `;
        document.body.appendChild(modal);
        document.body.style.overflow = 'hidden';
    }

    function closeQrModal() {
        const modal = document.getElementById('qrModal');
        if (modal) modal.remove();
        document.body.style.overflow = '';
    }

    // ================================================================
    // ===== IP =====
    // ================================================================
    async function getUserIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch { return null; }
    }

    // ================================================================
    // ===== ПРОВЕРКА СТАТУСА ПОДАРКА =====
    // ================================================================
    async function checkGiftStatus() {
        const ip = await getUserIP();
        if (!ip) {
            console.log('❌ Не удалось определить IP');
            return;
        }
        
        try {
            const res = await fetch('/api/gift/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip })
            });
            const data = await res.json();
            
            console.log('🎁 Статус подарка:', data);
            
            if (data.alreadyClaimed) {
                console.log('✅ Подарок уже выдан');
                return;
            }
            
            if (data.hasGift) {
                giftId = data.giftId;
                showGiftModal();
                $('floatQrBtn').style.display = 'flex';
                console.log(`🎁 Подарок #${giftId} активен`);
            } else if (data.canActivate) {
                await activateGift(ip);
            }
            
        } catch(e) {
            console.error('❌ Ошибка проверки подарка:', e);
        }
    }

    // ================================================================
    // ===== АКТИВАЦИЯ ПОДАРКА =====
    // ================================================================
    async function activateGift(ip) {
        try {
            const res = await fetch('/api/gift/activate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip })
            });
            const data = await res.json();
            if (data.success) {
                giftId = data.giftId;
                showGiftModal();
                $('floatQrBtn').style.display = 'flex';
                console.log(`🎁 Создан новый подарок #${giftId}`);
            }
        } catch(e) { 
            console.error('Gift activate error:', e); 
        }
    }

    // ================================================================
    // ===== ПЕРИОДИЧЕСКАЯ ПРОВЕРКА СТАТУСА ПОДАРКА =====
    // ================================================================
    function startGiftCheck() {
        if (giftCheckInterval) clearInterval(giftCheckInterval);
        giftCheckInterval = setInterval(async () => {
            if (document.getElementById('giftModal').classList.contains('open')) {
                const ip = await getUserIP();
                if (!ip) return;
                
                try {
                    const res = await fetch('/api/gift/status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ip })
                    });
                    const data = await res.json();
                    
                    if (data.alreadyClaimed) {
                        console.log('✅ Подарок выдан, закрываем окно');
                        closeGiftModal();
                        $('floatQrBtn').style.display = 'none';
                        showNotification('🎉 Поздравляем! Подарок получен! 🍓');
                        clearInterval(giftCheckInterval);
                        giftCheckInterval = null;
                    }
                } catch(e) {
                    console.error('❌ Ошибка проверки:', e);
                }
            }
        }, 10000);
    }

    // ================================================================
    // ===== МОДАЛКА =====
    // ================================================================
    function showGiftModal() {
        $('giftModal').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeGiftModal() {
        $('giftModal').classList.remove('open');
        document.body.style.overflow = '';
    }

    // ================================================================
    // ===== ГЕОЛОКАЦИЯ ДЛЯ iOS =====
    // ================================================================
    
    // Функция запроса геолокации с обходным путем для iOS PWA
    function requestLocation() {
        // Вариант 1: Добавить небольшую задержку (решение для проблемы с PWA)
        setTimeout(() => {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    console.log('Позиция получена:', position);
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    if (!gpsLocked) {
                        gpsLocked = true;
                        showNotification('✅ Местоположение определено');
                    }
                    updateUserMarker(userLocation.lat, userLocation.lng);
                    updateDistance();
                },
                (error) => {
                    console.error('Ошибка геолокации:', error.message);
                    if (!gpsLocked) {
                        let msg = '❌ Не удалось определить местоположение';
                        if (error.code === 1) msg = '❌ Разрешите доступ к геолокации';
                        if (error.code === 2) msg = '❌ Сигнал GPS слабый, попробуйте выйти на улицу';
                        showNotification(msg);
                    }
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }, 500);
    }

    // Вариант 2: Проверить, что приложение активно
    function requestLocationWhenActive() {
        if (document.visibilityState === 'visible') {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    console.log('Позиция получена:', position);
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    if (!gpsLocked) {
                        gpsLocked = true;
                        showNotification('✅ Местоположение определено');
                    }
                    updateUserMarker(userLocation.lat, userLocation.lng);
                    updateDistance();
                },
                (error) => {
                    console.error('Ошибка геолокации:', error.message);
                    if (!gpsLocked) {
                        let msg = '❌ Не удалось определить местоположение';
                        if (error.code === 1) msg = '❌ Разрешите доступ к геолокации';
                        if (error.code === 2) msg = '❌ Сигнал GPS слабый, попробуйте выйти на улицу';
                        showNotification(msg);
                    }
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            document.addEventListener('visibilitychange', function handler() {
                if (document.visibilityState === 'visible') {
                    requestLocationWhenActive();
                    document.removeEventListener('visibilitychange', handler);
                }
            });
        }
    }

    // ================================================================
    // ===== КАРТА =====
    // ================================================================
    function initMap() {
        if (typeof ymaps === 'undefined') { 
            setTimeout(initMap, 1000); 
            return; 
        }
        ymaps.ready(() => {
            ymapsReady = true;
            try {
                mapInstance = new ymaps.Map('treasureMap', {
                    center: [MY_LOCATION.lat, MY_LOCATION.lng],
                    zoom: 17,
                    controls: ['zoomControl', 'typeSelector']
                });
                mapReady = true;

                // КИОСК С КАРТИНКОЙ
                kioskPlacemark = new ymaps.Placemark(
                    [MY_LOCATION.lat, MY_LOCATION.lng],
                    { 
                        balloonContent: '🍓 Strawberry in Chocolate',
                        hintContent: '🍓 Strawberry in Chocolate',
                        iconCaption: '🍓 Клубника в шоколаде'
                    },
                    { 
                        iconLayout: 'default#image',
                        iconImageHref: 'images/kiosk-icon.png',
                        iconImageSize: [50, 50],
                        iconImageOffset: [-25, -50],
                        iconCaptionMaxWidth: 150,
                        iconCaptionFontSize: 12,
                        iconCaptionFontWeight: 'bold',
                        iconCaptionColor: '#FFFFFF',
                        iconCaptionStrokeColor: 'rgba(0,0,0,0.8)',
                        iconCaptionStrokeWidth: 3
                    }
                );
                mapInstance.geoObjects.add(kioskPlacemark);

                // ЗАПРАШИВАЕМ ГЕОЛОКАЦИЮ С ОБХОДНЫМ ПУТЕМ ДЛЯ iOS
                requestLocation();
                // или requestLocationWhenActive();

                console.log('🗺️ Карта загружена!');
            } catch(e) { 
                console.error('Map error:', e);
                setTimeout(initMap, 2000);
            }
        });
    }

    // ================================================================
    // ===== GPS =====
    // ================================================================
    function getMyLocation() {
        if (!navigator.geolocation) {
            showNotification('❌ Браузер не поддерживает геолокацию');
            return;
        }

        if (!gpsLocked) {
            showNotification('📍 Определение местоположения...');
        }

        if (watchId) navigator.geolocation.clearWatch(watchId);

        watchId = navigator.geolocation.watchPosition(
            (pos) => {
                userLocation = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude
                };
                if (!gpsLocked) {
                    gpsLocked = true;
                    showNotification('✅ Местоположение определено');
                }
                updateUserMarker(userLocation.lat, userLocation.lng);
                updateDistance();
            },
            (error) => {
                console.error('GPS Error:', error);
                if (!gpsLocked) {
                    let msg = '❌ Не удалось определить местоположение';
                    if (error.code === 1) msg = '❌ Разрешите доступ к геолокации';
                    if (error.code === 2) msg = '❌ Сигнал GPS слабый, попробуйте выйти на улицу';
                    showNotification(msg);
                }
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 5000
            }
        );
    }

    function updateUserMarker(lat, lng) {
        if (!mapInstance || !mapReady) return;
        if (userPlacemark) mapInstance.geoObjects.remove(userPlacemark);
        userPlacemark = new ymaps.Placemark(
            [lat, lng],
            { 
                balloonContent: '🍓 Ты здесь!',
                hintContent: 'Ваше местоположение'
            },
            { 
                iconLayout: 'default#image', 
                iconImageHref: 'https://emojicdn.elk.sh/🍓', 
                iconImageSize: [36,36], 
                iconImageOffset: [-18,-18] 
            }
        );
        mapInstance.geoObjects.add(userPlacemark);
    }

    function centerOnUser() {
        if (!userLocation || !mapInstance) {
            showNotification('📍 Не могу определить местоположение');
            requestLocation();
            return;
        }
        
        mapInstance.setCenter([userLocation.lat, userLocation.lng], 19, { 
            duration: 800,
            checkZoomRange: true
        });
        
        if (userPlacemark) userPlacemark.balloon.open();
        updateDistance();
        showNotification('📍 Ты здесь!');
    }

    // ================================================================
    // ===== РАССТОЯНИЕ ДО КИОСКА =====
    // ================================================================
    function updateDistance() {
        if (!userLocation) return;
        
        const distance = getDistance(
            userLocation.lat, userLocation.lng,
            MY_LOCATION.lat, MY_LOCATION.lng
        );
        
        const steps = Math.round(distance * 1000 / 0.75);
        
        const info = $('distanceInfo');
        info.classList.add('show');
        $('stepsCount').textContent = steps;
        $('distanceKm').textContent = distance.toFixed(2);
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // ================================================================
    // ===== УВЕДОМЛЕНИЯ =====
    // ================================================================
    function showNotification(msg) {
        const existing = document.querySelector('.notification');
        if (existing) existing.remove();
        const n = document.createElement('div');
        n.className = 'notification';
        n.textContent = msg;
        document.body.appendChild(n);
        setTimeout(() => {
            n.style.opacity = '0';
            n.style.transform = 'translateX(-50%) translateY(-20px)';
            n.style.transition = 'all 0.3s ease';
            setTimeout(() => n.remove(), 3000);
        }, 3000);
    }

    // ================================================================
    // ===== INIT =====
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
        renderMenu();
        setTimeout(initMap, 500);
        setTimeout(checkGiftStatus, 1000);
        setTimeout(startGiftCheck, 2000);
        console.log('🍓 Страница загружена!');
    });
</script>
